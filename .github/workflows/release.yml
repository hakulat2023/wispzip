name: Release

# Build desktop bundles for all three platforms on a version tag.
# Artifacts:
#   macOS  -> .app (zipped) + .dmg
#   Windows-> .msi (WiX) + .exe (NSIS setup)
#   Linux  -> .deb + .rpm + .AppImage
# Draft a GitHub release with everything attached.

on:
  push:
    tags: ["v*"]
  # Only tag pushes trigger a release build; day-to-day pushes and PRs run no CI.

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: "app,dmg"
          - os: macos-latest
            target: x86_64-apple-darwin
            bundles: "app,dmg"
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: "msi,nsis"
          - os: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            bundles: "deb,rpm,appimage"

    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v6
        with:
          run_install: false
        # Version comes from the packageManager field in package.json (pnpm@11.23.0)

      - name: Install Node 22
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: . -> target
          key: ${{ matrix.target }}

      # Linux-only system deps for Tauri (webkit2gtk etc.)
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev \
            librsvg2-dev patchelf libssl-dev libgtk-3-dev libayatana-appindicator3-dev

      - name: Install frontend deps
        run: pnpm install --frozen-lockfile

      - name: Run core tests
        run: cargo test --workspace --release

      # macOS is split into two steps: build the .app and ad-hoc sign it, then wrap the dmg,
      # otherwise the unsigned app is reported as "damaged" by Gatekeeper after download
      - name: Build app bundle (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles app

      - name: Ad-hoc codesign app (macOS)
        if: runner.os == 'macOS'
        run: |
          for app in target/*/release/bundle/macos/*.app; do
            codesign --force --deep --sign - "$app"
            codesign --verify --deep "$app" && echo "signed: $app"
          done

      - name: Build dmg (macOS)
        if: runner.os == 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles dmg

      - name: Build bundles (Windows / Linux)
        if: runner.os != 'macOS'
        run: pnpm tauri build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Collect artifacts
        id: collect
        shell: bash
        run: |
          mkdir -p dist
          found=$(find target/*/release/bundle target/release/bundle \
            -type f \( -name "*.dmg" -o -name "*.app.tar.gz" -o -name "*.msi" \
               -o -name "*.exe" -o -name "*.deb" -o -name "*.rpm" \
               -o -name "*.AppImage" \) 2>/dev/null || true)
          echo "$found" | tee /dev/stderr | xargs -I{} cp {} dist/ || true
          echo "files=$(ls dist | wc -l)" >> "$GITHUB_OUTPUT"

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          name: bundles-${{ matrix.os }}-${{ matrix.target }}
          path: dist/*

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v7
        with:
          path: dist
          merge-multiple: true

      - name: Draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: dist/*
