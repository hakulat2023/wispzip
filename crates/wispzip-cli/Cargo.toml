[package]
name = "wispzip-cli"
description = "Command-line shell for the WispZip compression engine"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "wispzip"
path = "src/main.rs"

[lib]
name = "wispzip_cli"
path = "src/lib.rs"

[dependencies]
wispzip-core = { workspace = true }
clap = { version = "4", features = ["derive"] }
